name: Daily Batch Inference

on:
  schedule:
    - cron: '30 * * * *' # Runs at minute 30 of every hour (giving the feature pipeline time to finish)
  workflow_dispatch:

jobs:
  run-inference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Execute Inference Pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: python pipelines/batch_inference.py